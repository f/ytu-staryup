<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullanıcılar — StaryUp Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e'}}}}}</script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="nav"></div>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Kullanıcılar</h1>
      <div class="flex items-center space-x-3">
        <input type="text" id="searchInput" placeholder="İsim veya e-posta ara..."
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none w-64">
        <button onclick="searchUsers()" class="bg-primary-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-primary-700">Ara</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 text-left text-gray-500 text-xs uppercase tracking-wider">
            <th class="px-6 py-3">Kullanıcı</th>
            <th class="px-6 py-3">E-posta</th>
            <th class="px-6 py-3">Kredi</th>
            <th class="px-6 py-3">Projeler</th>
            <th class="px-6 py-3">Başvurular</th>
            <th class="px-6 py-3">Kayıt</th>
            <th class="px-6 py-3">İşlem</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">Yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="pagination"></div>
  </div>

  <!-- Credit Modal -->
  <div id="creditModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md">
      <h3 class="text-lg font-semibold mb-4">Kredi İşlemi — <span id="modalUserName"></span></h3>
      <p class="text-sm text-gray-500 mb-4">Mevcut bakiye: <span id="modalUserCredits" class="font-bold text-primary-600"></span></p>
      
      <div class="space-y-4">
        <div class="flex space-x-4">
          <label class="flex items-center space-x-2">
            <input type="radio" name="operation" value="add" checked class="text-primary-600">
            <span class="text-sm">Kredi Ekle</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="radio" name="operation" value="remove" class="text-red-600">
            <span class="text-sm">Kredi Çıkar</span>
          </label>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Miktar</label>
          <input type="number" id="creditAmount" min="1" value="10"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Açıklama</label>
          <input type="text" id="creditDescription" placeholder="Kredi işlemi açıklaması"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div id="creditError" class="hidden bg-red-50 text-red-700 p-3 rounded-lg text-sm"></div>
      </div>

      <div class="flex justify-end space-x-3 mt-6">
        <button onclick="closeCreditModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800 text-sm">İptal</button>
        <button onclick="submitCredit()" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm hover:bg-primary-700">Uygula</button>
      </div>
    </div>
  </div>

  <!-- User Detail Modal -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-2xl max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold" id="detailUserName"></h3>
        <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>
      <div id="detailContent">Yükleniyor...</div>
    </div>
  </div>

  <script src="/admin/js/admin.js"></script>
  <script>
    requireAuth();
    renderNav('users');

    let currentPage = 1;
    let currentSearch = '';
    let selectedUserId = null;

    async function loadUsers(page = 1) {
      currentPage = page;
      const params = new URLSearchParams({ page, limit: 20 });
      if (currentSearch) params.set('search', currentSearch);

      const data = await api(`/users?${params}`);

      if (data.users.length === 0) {
        document.getElementById('userTable').innerHTML =
          '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">Kullanıcı bulunamadı.</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      document.getElementById('userTable').innerHTML = data.users.map(u => `
        <tr class="border-b border-gray-100 hover:bg-gray-50 ${u.banned ? 'bg-red-50' : ''}">
          <td class="px-6 py-4">
            <div class="flex items-center space-x-2">
              <span class="font-medium">${u.name}</span>
              ${u.banned ? '<span class="px-1.5 py-0.5 text-xs rounded bg-red-100 text-red-700">Banlı</span>' : ''}
            </div>
          </td>
          <td class="px-6 py-4 text-gray-600">${u.email}</td>
          <td class="px-6 py-4"><span class="font-semibold text-primary-600">${u.credits}</span></td>
          <td class="px-6 py-4">${u.projectCount}</td>
          <td class="px-6 py-4">${u.applicationCount}</td>
          <td class="px-6 py-4 text-gray-500">${formatDate(u.createdAt)}</td>
          <td class="px-6 py-4">
            <div class="flex space-x-2">
              <button onclick="openCreditModal('${u.id}', '${u.name}', ${u.credits})"
                class="text-primary-600 hover:text-primary-800 text-xs font-medium">Kredi</button>
              <button onclick="toggleBan('${u.id}', '${u.name}', ${u.banned})"
                class="${u.banned ? 'text-green-600 hover:text-green-800' : 'text-yellow-600 hover:text-yellow-800'} text-xs font-medium">${u.banned ? 'Banı Kaldır' : 'Banla'}</button>
              <button onclick="openDetail('${u.id}')"
                class="text-gray-500 hover:text-gray-700 text-xs font-medium">Detay</button>
              <button onclick="confirmDeleteUser('${u.id}', '${u.name}')"
                class="text-red-600 hover:text-red-800 text-xs font-medium">Sil</button>
            </div>
          </td>
        </tr>
      `).join('');

      document.getElementById('pagination').innerHTML = paginate(data.page, data.totalPages, 'loadUsers');
    }

    function searchUsers() {
      currentSearch = document.getElementById('searchInput').value.trim();
      loadUsers(1);
    }

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchUsers();
    });

    function openCreditModal(userId, name, credits) {
      selectedUserId = userId;
      document.getElementById('modalUserName').textContent = name;
      document.getElementById('modalUserCredits').textContent = credits;
      document.getElementById('creditAmount').value = 10;
      document.getElementById('creditDescription').value = '';
      document.getElementById('creditError').classList.add('hidden');
      document.getElementById('creditModal').classList.remove('hidden');
    }

    function closeCreditModal() {
      document.getElementById('creditModal').classList.add('hidden');
      selectedUserId = null;
    }

    async function submitCredit() {
      const amount = parseInt(document.getElementById('creditAmount').value);
      const operation = document.querySelector('input[name="operation"]:checked').value;
      const description = document.getElementById('creditDescription').value.trim();
      const errorEl = document.getElementById('creditError');

      if (!description) {
        errorEl.textContent = 'Açıklama gerekli';
        errorEl.classList.remove('hidden');
        return;
      }

      try {
        await api(`/users/${selectedUserId}/credits`, {
          method: 'POST',
          body: JSON.stringify({ amount, operation, description }),
        });
        closeCreditModal();
        loadUsers(currentPage);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    }

    async function openDetail(userId) {
      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailContent').innerHTML = 'Yükleniyor...';

      const data = await api(`/users/${userId}`);
      document.getElementById('detailUserName').textContent = data.name;

      document.getElementById('detailContent').innerHTML = `
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div><span class="text-sm text-gray-500">E-posta:</span><p class="font-medium">${data.email}</p></div>
          <div><span class="text-sm text-gray-500">Kredi:</span><p class="font-bold text-primary-600 text-xl">${data.credits}</p></div>
          <div><span class="text-sm text-gray-500">Bio:</span><p class="text-sm">${data.bio || '—'}</p></div>
          <div><span class="text-sm text-gray-500">Kayıt:</span><p class="text-sm">${formatDate(data.createdAt)}</p></div>
        </div>
        <h4 class="font-semibold mb-3">Kredi Geçmişi</h4>
        ${data.transactions.length === 0
          ? '<p class="text-gray-500 text-sm">Henüz kredi hareketi yok.</p>'
          : `<table class="w-full text-sm">
              <thead><tr class="text-left text-gray-500 border-b text-xs">
                <th class="pb-2">Tür</th><th class="pb-2">Miktar</th><th class="pb-2">Açıklama</th><th class="pb-2">Tarih</th>
              </tr></thead>
              <tbody>
                ${data.transactions.map(tx => `
                  <tr class="border-b border-gray-50">
                    <td class="py-2">${txTypeBadge(tx.type)}</td>
                    <td class="py-2">${formatCredits(tx.amount)}</td>
                    <td class="py-2 text-gray-600">${tx.description || '—'}</td>
                    <td class="py-2 text-gray-500 text-xs">${formatDate(tx.createdAt)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
        }
      `;
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    async function toggleBan(userId, name, currentlyBanned) {
      const action = currentlyBanned ? 'banını kaldırmak' : 'banlamak';
      if (!confirm(`"${name}" adlı kullanıcıyı ${action} istediğinize emin misiniz?`)) return;

      await api(`/users/${userId}/ban`, { method: 'PATCH' });
      loadUsers(currentPage);
    }

    async function confirmDeleteUser(userId, name) {
      if (!confirm(`"${name}" adlı kullanıcıyı silmek istediğinize emin misiniz?\n\nBu işlem geri alınamaz. Kullanıcının tüm projeleri, başvuruları ve kredi geçmişi silinecektir.`)) return;

      await api(`/users/${userId}`, { method: 'DELETE' });
      loadUsers(currentPage);
    }

    loadUsers();
  </script>
</body>
</html>
